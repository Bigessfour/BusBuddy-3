# 🚌 Trunk config for BusBuddy: .NET 9 WPF, PowerShell 7.5.2, Azure SQL
# Centralizes linting/formatting for consistent code quality across the project
# Reference: https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0

# Trunk plugins for extended functionality
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

# Runtime versions matching BusBuddy project standards
runtimes:
  enabled:
    - node@22.16.0 # For Prettier and other JS-based tools
    - python@3.14.4 # For SQLFluff and other Python-based tools

# Core linting and formatting configuration
lint:
  disabled:
    - markdownlint # Using custom markdown standards
    - codespell # Spelling disabled — too noisy for domain terms
    - cspell # Spelling disabled — too noisy for domain terms
  enabled:
    # Security and infrastructure scanning
    - dotnet-format@7.0.400
    - checkov@3.3.11 # Infrastructure as code security
    - git-diff-check # Git hygiene
    - osv-scanner@2.2.4 # Vulnerability scanning
    - trufflehog@3.97.0 # Secret detection

    # Code formatting and quality
    - prettier@3.9.6 # JSON, YAML formatting
    - yamllint@1.38.0 # YAML linting

    # PowerShell linting and formatting
    - psscriptanalyzer@1.25.0 # PowerShell best practices

  # File path ignores for build artifacts, generated data, and archive noise
  ignore:
    - linters: [ALL]
      paths:
        - "**/*.disabled" # Disabled files for clean builds
        - "**/bin/**" # Build outputs
        - "**/obj/**" # Build intermediates
        - "**/TestResults/**" # Test outputs
        - "**/logs/**" # Log files
        - "**/artifacts/**" # Build artifacts
        - "**/Migrations/**" # EF auto-generated migrations
        - "rag/**" # Local RAG index / chroma binaries
        - "Documentation/Archive/**" # Historical reports, not live code
        - ".agents/**" # Vendored skill copies
        - "**/*.pdf"
        - "docs/function-inventory.generated.md"
    - linters: [git-diff-check]
      paths:
        - ".vscode/settings.json" # VS Code settings have different formatting standards
        - ".vscode/tasks.json" # VS Code tasks have different formatting standards

# Git hooks and actions configuration
actions:
  disabled:
    - git-lfs # Not using Git LFS
    - trunk-announce # Reduce noise
  enabled:
    - trunk-upgrade-available # Version update notifications
    - trunk-fmt-pre-commit # Auto-format on commit
    - trunk-check-pre-push # Check quality before push

# Tools configuration
tools:
  enabled:
    - dotnet@7.0.400
    - pwsh@7.4.1
    - converttosarif@1.25.0 # SARIF conversion for VS Code integration
